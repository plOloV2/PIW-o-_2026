<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły gry - Planszowa Kryjówka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" style="color:white; text-decoration:none;">🎲 Planszowa Kryjówka</a></div>
        <div class="header-actions">
            <button class="btn">Zaloguj / Wyloguj</button>
            <button class="btn btn-primary">Koszyk (0)</button>
        </div>
    </header>

    <main class="container">
        <section class="product-details">
            <a href="index.html" class="back-link">← Wróć do wyszukiwarki</a>
            
            <div class="details-grid">
                <div class="details-image">
                    <img src="Small-World.webp" alt="Small World" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                </div>
                <div class="details-info">
                    <h2>Small World</h2>
                    <p class="price-large">180 PLN</p>
                    <div class="tags">
                        <span>Rodzaj: Strategiczna</span>
                        <span>Gracze: 1-5</span>
                        <span>Czas: 60-90 min</span>
                        <span>Wydawnictwo: Rebel</span>
                    </div>
                    <p class="full-description">
                        Small World to gra, w której gracze prowadzą swoje nacje w świecie, który jest po prostu za mały, aby pomieścić je wszystkie...
                    </p>
                    <button class="btn btn-primary add-to-cart-large">Dodaj do koszyka</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
